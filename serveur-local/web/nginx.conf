# Serveur web du POS : l'application (fichiers compilés) et l'API Supabase sur la même adresse.
#   /auth/v1/       → authentification (GoTrue)
#   /rest/v1/       → API des tables (PostgREST)
#   /realtime/v1/   → temps réel (WebSocket)
#   /storage/v1/    → photos (Storage)
#   /functions/v1/  → fonctions Edge (pin-login)
#   /               → l'application

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 50m;

  # Résolution à chaque requête : nginx démarre même si un service n'est pas encore prêt.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $auth      auth:9999;
  set $rest      rest:3000;
  set $realtime  realtime-dev.supabase-realtime:4000;
  set $storage   storage:5000;
  set $functions functions:9000;

  proxy_http_version 1.1;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_read_timeout 120s;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /auth/v1/ {
    rewrite ^/auth/v1/(.*)$ /$1 break;
    proxy_set_header Host $http_host;
    proxy_pass http://$auth;
  }

  location /rest/v1/ {
    rewrite ^/rest/v1/(.*)$ /$1 break;
    proxy_set_header Host $http_host;
    proxy_pass http://$rest;
  }

  location /realtime/v1/api/ {
    rewrite ^/realtime/v1/api/(.*)$ /api/$1 break;
    proxy_set_header Host realtime-dev.supabase-realtime;
    proxy_pass http://$realtime;
  }

  location /realtime/v1/ {
    rewrite ^/realtime/v1/(.*)$ /socket/$1 break;
    # Realtime lit le nom du « tenant » (realtime-dev) dans l'adresse.
    proxy_set_header Host realtime-dev.supabase-realtime;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_pass http://$realtime;
  }

  location /storage/v1/ {
    rewrite ^/storage/v1/(.*)$ /$1 break;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Prefix /storage/v1;
    proxy_pass http://$storage;
  }

  location /functions/v1/ {
    rewrite ^/functions/v1/(.*)$ /$1 break;
    proxy_set_header Host $http_host;
    proxy_pass http://$functions;
  }

  # Toujours la dernière version de l'application après une mise à jour.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }
  location = /version.json {
    add_header Cache-Control "no-store";
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
