# ═══════════════════════════════════════════════════════════════════════════════════════════════
# Réglages du POS : démarrage automatique, mode caisse, sauvegardes.
# Ce fichier est copié en « config.ini » au premier lancement de 5-ACTIVER-DEMARRAGE-AUTO.bat.
# Modifiez config.ini avec le Bloc-notes (clic droit > Ouvrir avec > Bloc-notes), jamais ce modèle :
# config.ini n'est pas remplacé par une mise à jour.
# Après une modification, relancez 5-ACTIVER-DEMARRAGE-AUTO.bat.
# ═══════════════════════════════════════════════════════════════════════════════════════════════

# Adresse IP du POS sur le réseau du restaurant (notée automatiquement par 5-ACTIVER-DEMARRAGE-AUTO.bat).
# VERIFIER.bat prévient si l'adresse actuelle du POS est différente : les tablettes ne le trouveraient plus.
# Pour qu'elle ne change jamais : réservation DHCP dans le routeur (LISEZMOI.md, section Réseau).
IP_POS=

# Ouvrir l'application en plein écran (mode caisse) à l'ouverture de session de Windows : oui / non
KIOSQUE_AU_DEMARRAGE=oui

# Heure de la sauvegarde quotidienne (HH:MM). Si le PC est éteint à cette heure-là, la sauvegarde est faite
# dès le démarrage suivant.
HEURE_SAUVEGARDE=04:00

# Faire aussi une sauvegarde après chaque clôture de caisse : oui / non
SAUVEGARDE_APRES_CLOTURE=oui

# Nombre de jours de sauvegardes gardés (les plus anciennes sont effacées, les 3 dernières jamais).
JOURS_A_GARDER=30

# Copie de chaque sauvegarde vers un 2e emplacement : clé USB, disque D:, disque externe…
# Vide = pas de copie. Si la clé USB est absente, la sauvegarde est faite quand même sur le POS
# et VERIFIER.bat le signale.
# Exemples :  COPIE_SAUVEGARDES=D:\SauvegardesSmile      COPIE_SAUVEGARDES=E:\SauvegardesSmile
COPIE_SAUVEGARDES=
